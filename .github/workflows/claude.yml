name: Claude (reusable — local execution)

# Reusable workflow that handles three modes:
#   - claude:wiki     → read-only Q&A, posts an issue comment with a Mermaid flowchart
#   - claude:fix      → full bug-fix flow: modifies code, commits + pushes directly to
#                       the project's `dev` branch with `fix #N`. No MR step.
#   - claude:feature  → full feature-implementation flow: same direct-push pipeline as
#                       fix but loads a feature-flavored prompt and uses `feat #N` semantics.
#                       Opt-in via `enable_feature_mode: true` in the caller workflow.
#
# Caller repos provide their own thin claude.yml that triggers on issues +
# issue_comment, then `uses:` this workflow with the project-specific inputs.
# See README.md for an onboarding template.
#
# A single self-hosted runner pool (label `claude-bot`) serves every project.
# Per-project concurrency groups (computed from `project_name`) keep same-project
# jobs serial (avoiding `git reset --hard` races on the shared local clones)
# while letting different projects run in parallel.

on:
  workflow_call:
    inputs:
      project_name:
        description: "Used for concurrency group + metrics label (e.g. 'casemanagement', 'membership')"
        required: true
        type: string
      subprojects:
        description: "Space-separated subproject directory names (e.g. 'membership-api membership-web membership-portal')"
        required: true
        type: string
      project_overview:
        description: "Multiline text shown under 'Workspace layout' (purpose of the project)"
        required: true
        type: string
      subproject_descriptions:
        description: "Multiline markdown bullets describing each subproject (one bullet per line)"
        required: true
        type: string
      workspace_root:
        description: "Absolute path on the runner. Default: /home/user6/innoways-project/<project_name>"
        required: false
        type: string
        default: ''
      docs_path:
        description: "Subdir of read-only docs (e.g. 'docs'). Empty = no docs section."
        required: false
        type: string
        default: ''
      docs_inline:
        description: "Space-separated doc filenames (under docs_path) to inline in the bug prompt"
        required: false
        type: string
        default: ''
      target_branch:
        description: "Branch Claude pushes commits to"
        required: false
        type: string
        default: 'dev'
      git_clean_exclude:
        description: "Pattern passed to 'git clean -e' (e.g. '.gitnexus'). Empty = no exclusion."
        required: false
        type: string
        default: ''
      target_prefix:
        description: "If set (e.g. 'membership-'), this prefix is added to Target Project values from the issue body when they don't already match a subproject. Lets templates expose short names."
        required: false
        type: string
        default: ''
      enable_wiki_mode:
        description: "If false, every request is treated as fix mode (for projects without a wiki template)"
        required: false
        type: boolean
        default: true
      enable_feature_mode:
        description: "If true, feature-request issues route to a feature-flavored prompt and 'feat #N' commits. Default false keeps legacy fix-only behavior."
        required: false
        type: boolean
        default: false
      wiki_timeout_seconds:
        required: false
        type: number
        default: 1200
      bug_timeout_seconds:
        required: false
        type: number
        default: 1800
      post_merge_notice:
        description: "One-line text appended to the push-success comment on the source issue (e.g. deploy timing)."
        required: false
        type: string
        default: ''
      gitnexus_repos:
        description: "Space-separated repos to mention in the wiki prompt's GitNexus section. Default: same as subprojects. Set to ' ' (one space) to disable."
        required: false
        type: string
        default: ''
      claude_actions_ref:
        description: "Ref of Innoways-Ltd/claude-actions the runner-local mirror should sync to (default: deployment)"
        required: false
        type: string
        default: 'deployment'
      use_legacy_flow:
        description: "Kill switch — if true, skip project-config.yml loading entirely and use the legacy hardcoded direct_push flow (matches behavior before the configurable-terminal-action feature was added). Lets a caller roll back to the previous behavior with a single input flip."
        required: false
        type: boolean
        default: false

concurrency:
  # Per-project group: every project's jobs serialize on its own clones, but
  # cross-project jobs run in parallel up to the runner-pool size.
  group: claude-workspace-${{ inputs.project_name }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      github.event.sender.login != 'github-actions[bot]' &&
      (
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: [self-hosted, claude-bot]
    timeout-minutes: 60

    permissions:
      issues: write
      contents: read

    env:
      PROJECT_NAME: ${{ inputs.project_name }}
      SUBPROJECTS: ${{ inputs.subprojects }}
      WORKSPACE_ROOT: ${{ inputs.workspace_root != '' && inputs.workspace_root || format('/home/user6/innoways-project/{0}', inputs.project_name) }}
      DOCS_PATH: ${{ inputs.docs_path }}
      DOCS_INLINE: ${{ inputs.docs_inline }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      GIT_CLEAN_EXCLUDE: ${{ inputs.git_clean_exclude }}
      TARGET_PREFIX: ${{ inputs.target_prefix }}
      ENABLE_WIKI_MODE: ${{ inputs.enable_wiki_mode }}
      ENABLE_FEATURE_MODE: ${{ inputs.enable_feature_mode }}
      WIKI_TIMEOUT: ${{ inputs.wiki_timeout_seconds }}
      BUG_TIMEOUT: ${{ inputs.bug_timeout_seconds }}
      POST_MERGE_NOTICE: ${{ inputs.post_merge_notice }}
      PROJECT_OVERVIEW: ${{ inputs.project_overview }}
      SUBPROJECT_DESCRIPTIONS: ${{ inputs.subproject_descriptions }}
      GITNEXUS_REPOS: ${{ inputs.gitnexus_repos }}
      # Pinned to the runner-local mirror; the first step keeps it in sync
      # with origin/${{ inputs.claude_actions_ref }} under flock.
      SCRIPTS_DIR: /home/user6/claude-actions/scripts
      USE_LEGACY_FLOW: ${{ inputs.use_legacy_flow }}

    steps:
      # The runner keeps a persistent mirror of this repo at
      # /home/user6/claude-actions/. We sync it under a flock so concurrent
      # jobs across projects can't race on the same checkout, then expose
      # SCRIPTS_DIR so every later step references the runner-local copy
      # instead of trying to `actions/checkout` a private repo (which the
      # caller's GITHUB_TOKEN can't read across repo boundaries).
      - name: Sync runner-local claude-actions mirror
        id: sync_mirror
        env:
          MIRROR: /home/user6/claude-actions
          REF: ${{ inputs.claude_actions_ref }}
        run: |
          set -euo pipefail
          if [ ! -d "$MIRROR/.git" ]; then
            echo "::error::Runner-local mirror missing at $MIRROR. Set it up once with:"
            echo "  git clone --branch deployment https://github.com/Innoways-Ltd/claude-actions.git $MIRROR"
            exit 1
          fi
          # flock serializes mirror updates across the whole runner pool so
          # one job's `git reset` can't yank scripts mid-read for another job.
          flock -x /tmp/claude-actions-mirror.lock bash -c "
            set -euo pipefail
            cd '$MIRROR'
            git fetch --quiet origin '$REF'
            git reset --hard 'origin/$REF' >/dev/null
          "
          SCRIPTS_DIR="$MIRROR/scripts"
          echo "scripts_dir=$SCRIPTS_DIR" >> "$GITHUB_OUTPUT"
          echo "Using scripts from $SCRIPTS_DIR @ $(git -C "$MIRROR" rev-parse --short HEAD)"

      # ──────────────────────────────────────────────────────────────────
      # Optional: caller-repo checkout for .claude/project-config.yml
      #
      # In legacy mode we skip the checkout (saves an API call, matches the
      # pre-feature behavior exactly). When project-config support is on, we
      # need the caller's tree so load-project-config.py can read its YAML.
      # actions/checkout@v4 in a workflow_call context checks out the caller
      # repo at the SHA that triggered the run, which is exactly what we want.
      # ──────────────────────────────────────────────────────────────────
      - name: Checkout caller repo (for project-config)
        if: inputs.use_legacy_flow != true
        uses: actions/checkout@v4
        with:
          path: caller-repo

      - name: Load project config
        if: inputs.use_legacy_flow != true
        id: project_config
        env:
          DEFAULT_BASE_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          CFG="$GITHUB_WORKSPACE/caller-repo/.claude/project-config.yml"
          # load-project-config.py writes KEY=VALUE lines (shell-quoted).
          # Piping through `eval` so quoted values survive into the env, then
          # forwarding the resolved values into $GITHUB_ENV for later steps.
          # If the YAML is malformed the script exits non-zero and the run
          # fails fast — we don't silently fall back, see plan §19.
          OUT=$(python3 "$SCRIPTS_DIR/load-project-config.py" "$CFG" \
                  --default-base-branch "$DEFAULT_BASE_BRANCH")
          echo "$OUT"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            # KEY=VALUE where VALUE may be shlex-quoted. eval-then-export so
            # the quoting unwraps correctly, then forward to GITHUB_ENV.
            eval "$line"
            KEY="${line%%=*}"
            VAL="$(eval "echo \"\$$KEY\"")"
            printf '%s<<__EOF__\n%s\n__EOF__\n' "$KEY" "$VAL" >> "$GITHUB_ENV"
          done <<< "$OUT"
          # Mirror BASE_BRANCH into TARGET_BRANCH so existing downstream steps
          # (Prepare subprojects, sensitive-path check, push) keep working
          # without renames. project-config wins over workflow input.
          printf 'TARGET_BRANCH<<__EOF__\n%s\n__EOF__\n' "$BASE_BRANCH" >> "$GITHUB_ENV"

      - name: Ensure claude:* labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL: ${{ github.repository }}
        run: |
          # All status labels we ever set across direct_push, merge_request,
          # and wiki modes. --force is idempotent on existing labels.
          for state in pushed no-change blocked run-failed answered mr-opened conflict; do
            gh label create "claude:$state" \
              --repo "$REPO_FULL" \
              --description "Auto-set by Claude workflow" \
              --force >/dev/null 2>&1 || true
          done
          # Entry labels (set by issue templates) — make sure they exist.
          gh label create "claude:fix"     --repo "$REPO_FULL" --description "Bug-fix request"  --force >/dev/null 2>&1 || true
          gh label create "claude:wiki"    --repo "$REPO_FULL" --description "Wiki question"    --force >/dev/null 2>&1 || true
          gh label create "claude:feature" --repo "$REPO_FULL" --description "Feature request"  --force >/dev/null 2>&1 || true

      - name: Helper — compute git clean args
        id: clean_args
        run: |
          if [ -n "$GIT_CLEAN_EXCLUDE" ]; then
            echo "args=-fd -e $GIT_CLEAN_EXCLUDE" >> "$GITHUB_OUTPUT"
          else
            echo "args=-fd" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine mode from issue labels and body
        id: mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          # Labels are the primary signal, but GitHub silently drops template
          # labels that don't yet exist on the repo (chicken-and-egg with the
          # very first issue). Fall back to body-template markers:
          #   wiki template renders     `### Your question`
          #   feature template renders  `### Acceptance criteria` (and `### Target Project`)
          #   bug template renders      `### Target Project`
          # Feature checks come before bug checks because the feature template
          # also has `### Target Project` — checking `### Acceptance criteria`
          # first disambiguates.
          LABELS=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO_FULL" --json labels --jq '.labels[].name' || true)
          echo "Labels on issue:"
          printf '%s\n' "$LABELS"

          if [ "$ENABLE_WIKI_MODE" = "false" ]; then
            MODE=fix
            REASON="enable_wiki_mode=false in caller workflow"
          elif echo "$LABELS" | grep -qx 'claude:wiki'; then
            MODE=wiki
            REASON="label claude:wiki"
          elif [ "$ENABLE_FEATURE_MODE" = "true" ] && echo "$LABELS" | grep -qx 'claude:feature'; then
            MODE=feature
            REASON="label claude:feature"
          elif echo "$LABELS" | grep -qx 'claude:fix'; then
            MODE=fix
            REASON="label claude:fix"
          elif printf '%s' "$BODY" | grep -q '^### Your question'; then
            MODE=wiki
            REASON="body has '### Your question' (wiki template)"
          elif [ "$ENABLE_FEATURE_MODE" = "true" ] && printf '%s' "$BODY" | grep -q '^### Acceptance criteria'; then
            MODE=feature
            REASON="body has '### Acceptance criteria' (feature template)"
          elif printf '%s' "$BODY" | grep -q '^### Target Project'; then
            MODE=fix
            REASON="body has '### Target Project' (bug template)"
          else
            MODE=fix
            REASON="no template marker found, defaulting to fix"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved MODE=$MODE ($REASON)"

      # ──────────────────────────────────────────────────────────────────
      # Shared: fetch issue context + reset all clones to origin/dev
      # ──────────────────────────────────────────────────────────────────

      - name: Prepare subprojects (clean + pull dev)
        # Self-heal from leftover state of a previous crashed / killed run:
        # auto-discard uncommitted changes, force-switch to dev, hard-reset,
        # and prune leftover `claude/*` branches. The clones are runner-only
        # workspaces — no human edits should ever live there, so any dirty
        # state is by definition recoverable.
        env:
          CLEAN_ARGS: ${{ steps.clean_args.outputs.args }}
        run: |
          set -euo pipefail
          for sub in $SUBPROJECTS; do
            cd "$WORKSPACE_ROOT/${sub}"
            if ! git diff-index --quiet HEAD -- || [ -n "$(git status --porcelain)" ]; then
              echo "::warning::${sub} had dirty working tree — auto-cleaning:"
              git status --short || true
              git checkout -- . || true
              git clean $CLEAN_ARGS || true
            fi
            git fetch origin
            git checkout "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"
            git clean $CLEAN_ARGS
            # Prune any leftover claude/* branches from the pre-direct-push era
            # (when each run created a side branch and opened an MR). Cheap
            # insurance — direct-push no longer creates these locally.
            for stale in $(git for-each-ref --format='%(refname:short)' refs/heads/claude 2>/dev/null); do
              if [ "$stale" != "$(git rev-parse --abbrev-ref HEAD)" ]; then
                echo "::notice::pruning leftover branch ${sub}:$stale"
                git branch -D "$stale" || true
              fi
            done
            echo "${sub}: $(git rev-parse --short HEAD)"
          done

      - name: Fetch issue context (body + all comments)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/claude-job
          gh issue view "$ISSUE_NUMBER" --repo "$REPO_FULL" --json title,body,comments \
            > /tmp/claude-job/issue.json
          echo "Fetched issue #$ISSUE_NUMBER ($(jq -r '.comments | length' /tmp/claude-job/issue.json) comments)"

      # ══════════════════════════════════════════════════════════════════
      # WIKI PATH
      # ══════════════════════════════════════════════════════════════════

      - name: Build wiki prompt
        if: steps.mode.outputs.mode == 'wiki'
        env:
          REPO_FULL: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          python3 "$SCRIPTS_DIR/build-prompt.py" --mode wiki > /tmp/claude-job/prompt.md
          echo "Prompt size: $(wc -c < /tmp/claude-job/prompt.md) bytes"
          echo "----- Prompt preview (first 40 lines) -----"
          head -40 /tmp/claude-job/prompt.md

      - name: Run Claude (wiki — read-only Q&A)
        if: steps.mode.outputs.mode == 'wiki'
        id: run_wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLEAN_ARGS: ${{ steps.clean_args.outputs.args }}
        run: |
          set -euo pipefail
          cd "$WORKSPACE_ROOT"
          PROMPT=$(cat /tmp/claude-job/prompt.md)
          # Wiki mode is read-only by INSTRUCTION; we still use bypassPermissions
          # so Read/Grep don't prompt under no-TTY. The post-step verifies no
          # files were modified and reverts if Claude misbehaves.
          set +e
          timeout "$WIKI_TIMEOUT" claude -p "$PROMPT" \
            --permission-mode bypassPermissions \
            --output-format text > /tmp/claude-job/output.log 2>&1
          EXIT=$?
          set -e
          echo "Claude exit: $EXIT"
          echo "----- Last 80 lines of Claude output -----"
          tail -80 /tmp/claude-job/output.log || true

          if [ "$EXIT" -ne 0 ]; then
            echo "::error::claude -p (wiki) exited with code $EXIT"
            # Revert any half-finished edits so the next run is clean.
            for sub in $SUBPROJECTS; do
              ( cd "$WORKSPACE_ROOT/${sub}" && git checkout -- . && git clean $CLEAN_ARGS ) || true
            done
            REASON="claude -p exited with code $EXIT"
            if [ "$EXIT" = "124" ]; then
              REASON="claude -p timed out after ${WIKI_TIMEOUT}s (exit 124)"
            fi
            {
              printf 'Claude wiki run failed: %s.\n\n' "$REASON"
              printf 'Last 80 lines of output:\n\n'
              printf '```\n'
              tail -80 /tmp/claude-job/output.log 2>/dev/null || echo "(no log)"
              printf '\n```\n\n[Full run log](%s)\n' "$RUN_URL"
            } > /tmp/claude-job/run-failed.md
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO_FULL" --body-file /tmp/claude-job/run-failed.md || true
            "$SCRIPTS_DIR/set-issue-label.sh" run-failed
            exit 1
          fi

      - name: Verify wiki mode made no file changes
        if: steps.mode.outputs.mode == 'wiki'
        id: wiki_dirty
        env:
          CLEAN_ARGS: ${{ steps.clean_args.outputs.args }}
        run: |
          set -euo pipefail
          DIRTY=0
          for sub in $SUBPROJECTS; do
            cd "$WORKSPACE_ROOT/${sub}"
            if [ -n "$(git status --porcelain)" ]; then
              echo "::warning::${sub} dirty after wiki run — reverting:"
              git status --short
              git checkout -- . || true
              git clean $CLEAN_ARGS || true
              DIRTY=1
            fi
          done
          echo "dirty=$DIRTY" >> "$GITHUB_OUTPUT"

      - name: Post wiki answer
        if: steps.mode.outputs.mode == 'wiki'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DIRTY: ${{ steps.wiki_dirty.outputs.dirty }}
        run: |
          set -euo pipefail
          "$SCRIPTS_DIR/post-result.sh" wiki_answer "$RUN_URL" "$DIRTY" \
            > /tmp/claude-job/wiki-comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO_FULL" --body-file /tmp/claude-job/wiki-comment.md
          "$SCRIPTS_DIR/set-issue-label.sh" answered

      # ══════════════════════════════════════════════════════════════════
      # FIX / FEATURE PATH (code-change requests)
      # ══════════════════════════════════════════════════════════════════

      - name: Determine target repo from issue body
        if: contains(fromJSON('["fix","feature"]'), steps.mode.outputs.mode)
        id: target
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          RAW=$(printf '%s' "$BODY" | python3 -c "import sys,re; body=sys.stdin.read(); m=re.search(r'###\s+Target Project[^\n]*\n+\s*(\S+)', body); print((m.group(1) if m else '').strip())")
          if [ -z "$RAW" ]; then
            echo "::error::Could not find 'Target Project' marker in issue body."
            exit 1
          fi
          # Match strategy:
          #   1) RAW already matches a subproject name exactly → use it
          #   2) target_prefix + RAW matches a subproject → prepend prefix
          #   3) RAW with target_prefix stripped matches → use stripped (legacy short form)
          TARGET=""
          for sub in $SUBPROJECTS; do
            if [ "$RAW" = "$sub" ]; then TARGET="$sub"; break; fi
          done
          if [ -z "$TARGET" ] && [ -n "$TARGET_PREFIX" ]; then
            CANDIDATE="${TARGET_PREFIX}${RAW}"
            for sub in $SUBPROJECTS; do
              if [ "$CANDIDATE" = "$sub" ]; then TARGET="$sub"; break; fi
            done
          fi
          if [ -z "$TARGET" ] && [ -n "$TARGET_PREFIX" ]; then
            STRIPPED="${RAW#$TARGET_PREFIX}"
            for sub in $SUBPROJECTS; do
              if [ "$STRIPPED" = "$sub" ]; then TARGET="$sub"; break; fi
            done
          fi
          if [ -z "$TARGET" ]; then
            echo "::error::Could not match 'Target Project' value '$RAW' to any subproject (expected one of: $SUBPROJECTS, with optional prefix '$TARGET_PREFIX')."
            exit 1
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Resolved target: $TARGET (raw input was '$RAW')"

      - name: Build code-change prompt
        if: contains(fromJSON('["fix","feature"]'), steps.mode.outputs.mode)
        env:
          REPO_FULL: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TARGET: ${{ steps.target.outputs.target }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          # MODE is "fix" (bug) or "feature"; build-prompt.py uses "bug" for
          # fix mode since that's the historical name of the corresponding
          # prompt builder.
          if [ "$MODE" = "feature" ]; then
            PROMPT_MODE=feature
          else
            PROMPT_MODE=bug
          fi
          python3 "$SCRIPTS_DIR/build-prompt.py" --mode "$PROMPT_MODE" > /tmp/claude-job/prompt.md
          echo "Prompt mode: $PROMPT_MODE"
          echo "Prompt size: $(wc -c < /tmp/claude-job/prompt.md) bytes"
          echo "----- Prompt preview (first 40 lines) -----"
          head -40 /tmp/claude-job/prompt.md

      - name: Run Claude across subprojects
        if: contains(fromJSON('["fix","feature"]'), steps.mode.outputs.mode)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLEAN_ARGS: ${{ steps.clean_args.outputs.args }}
        run: |
          set -euo pipefail
          cd "$WORKSPACE_ROOT"
          PROMPT=$(cat /tmp/claude-job/prompt.md)
          set +e
          timeout "$BUG_TIMEOUT" claude -p "$PROMPT" \
            --permission-mode bypassPermissions \
            --output-format text > /tmp/claude-job/output.log 2>&1
          EXIT=$?
          set -e
          echo "Claude exit: $EXIT"
          echo "----- Last 80 lines of Claude output -----"
          tail -80 /tmp/claude-job/output.log || true

          if [ "$EXIT" -ne 0 ]; then
            echo "::error::claude -p exited with code $EXIT"
            for sub in $SUBPROJECTS; do
              ( cd "$WORKSPACE_ROOT/${sub}" && git checkout -- . && git clean $CLEAN_ARGS ) || true
            done
            REASON="claude -p exited with code $EXIT"
            if [ "$EXIT" = "124" ]; then
              REASON="claude -p timed out after ${BUG_TIMEOUT}s (exit 124)"
            fi
            {
              printf 'Claude run failed: %s.\n\n' "$REASON"
              printf 'No commit pushed. Last 80 lines of output:\n\n'
              printf '```\n'
              tail -80 /tmp/claude-job/output.log 2>/dev/null || echo "(no log)"
              printf '\n```\n\n[Full run log](%s)\n' "$RUN_URL"
            } > /tmp/claude-job/run-failed.md
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO_FULL" --body-file /tmp/claude-job/run-failed.md || true
            "$SCRIPTS_DIR/set-issue-label.sh" run-failed
            exit 1
          fi

          for sub in $SUBPROJECTS; do
            echo "----- ${sub} files changed -----"
            ( cd "$WORKSPACE_ROOT/${sub}" && git status --porcelain ) || true
          done

      - name: Sensitive-path post-check across subprojects
        if: contains(fromJSON('["fix","feature"]'), steps.mode.outputs.mode)
        id: paths
        # NOTE: keep this list in sync with build-prompt.py instruction #4 (bug) / #5 (feature).
        run: |
          set -euo pipefail
          BLOCKED=""
          CHANGED_SUBS=""
          for sub in $SUBPROJECTS; do
            cd "$WORKSPACE_ROOT/${sub}"
            DIFF=$(git status --porcelain | awk '{print $2}')
            if [ -z "$DIFF" ]; then
              continue
            fi
            CHANGED_SUBS="${CHANGED_SUBS}${sub} "
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                .env*|*/.env*|secrets/*|*/secrets/*|.github/*) BLOCKED="${BLOCKED}- ${sub}: $f"$'\n' ;;
                */migrations/*|migrations/*|schema/*|*/schema/*) BLOCKED="${BLOCKED}- ${sub}: $f"$'\n' ;;
                controllers/auth/*|*/controllers/auth/*|middleware/auth/*|*/middleware/auth/*|action/login/*|*/action/login/*|*/auth/*|auth/*) BLOCKED="${BLOCKED}- ${sub}: $f"$'\n' ;;
              esac
            done <<< "$DIFF"
            # Catch any package.json (root or nested), not just the repo root.
            while IFS= read -r pkg; do
              [ -z "$pkg" ] && continue
              BASE_DEPS=$(git show "HEAD:${pkg}" 2>/dev/null | jq -S '.dependencies // {}' 2>/dev/null || echo '{}')
              HEAD_DEPS=$(jq -S '.dependencies // {}' "$pkg" 2>/dev/null || echo '{}')
              if [ "$BASE_DEPS" != "$HEAD_DEPS" ]; then
                BLOCKED="${BLOCKED}- ${sub}: ${pkg} (\`dependencies\` field changed)"$'\n'
              fi
            done < <(echo "$DIFF" | grep -E '(^|/)package\.json$' || true)
          done

          echo "changed_subs=${CHANGED_SUBS% }" >> "$GITHUB_OUTPUT"
          if [ -n "$BLOCKED" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            {
              echo "paths<<__EOF__"
              printf '%s' "$BLOCKED"
              echo "__EOF__"
            } >> "$GITHUB_OUTPUT"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Abort if sensitive paths touched
        if: contains(fromJSON('["fix","feature"]'), steps.mode.outputs.mode) && steps.paths.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PATHS: ${{ steps.paths.outputs.paths }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLEAN_ARGS: ${{ steps.clean_args.outputs.args }}
        run: |
          set -euo pipefail
          for sub in $SUBPROJECTS; do
            cd "$WORKSPACE_ROOT/${sub}"
            git checkout -- . || true
            git clean $CLEAN_ARGS || true
          done
          "$SCRIPTS_DIR/post-result.sh" issue_blocked "$RUN_URL" "$PATHS" > /tmp/claude-job/blocked.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO_FULL" --body-file /tmp/claude-job/blocked.md
          "$SCRIPTS_DIR/set-issue-label.sh" blocked
          exit 1

      # ══════════════════════════════════════════════════════════════════
      # Terminal action — direct_push OR merge_request
      #
      # Selected by env TERMINAL_ACTION (set by Load project config; defaults
      # to direct_push if no project-config.yml was provided). Each branch
      # owns its own commit/push/comment/label sequence; the no-change short-
      # circuit lives in a shared "Decide push fate" step run first.
      # ══════════════════════════════════════════════════════════════════

      - name: Decide push fate (no-change short-circuit)
        if: contains(fromJSON('["fix","feature"]'), steps.mode.outputs.mode) && steps.paths.outputs.blocked != 'true'
        id: decide_push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED_SUBS: ${{ steps.paths.outputs.changed_subs }}
          REPO_FULL: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          POST="$SCRIPTS_DIR/post-result.sh"
          if [ -z "$CHANGED_SUBS" ]; then
            "$POST" issue_no_chg "$RUN_URL" > /tmp/claude-job/no-change-comment.md
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO_FULL" --body-file /tmp/claude-job/no-change-comment.md
            "$SCRIPTS_DIR/set-issue-label.sh" no-change
            echo "skip_push=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip_push=false" >> "$GITHUB_OUTPUT"

      # ──────────────────────────────────────────────────────────────────
      # direct_push path — casemanagement style
      # ──────────────────────────────────────────────────────────────────
      - name: Commit & push directly to target branch — one per modified subproject
        if: |
          contains(fromJSON('["fix","feature"]'), steps.mode.outputs.mode) &&
          steps.paths.outputs.blocked != 'true' &&
          steps.decide_push.outputs.skip_push != 'true' &&
          (env.TERMINAL_ACTION == 'direct_push' || env.TERMINAL_ACTION == '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED_SUBS: ${{ steps.paths.outputs.changed_subs }}
          REPO_FULL: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          POST="$SCRIPTS_DIR/post-result.sh"

          if [ "$MODE" = "feature" ]; then
            COMMIT_PREFIX="feat"
          else
            COMMIT_PREFIX="fix"
          fi

          # ON_CONFLICT comes from project-config (defaults to "fail" per plan
          # §14 locked decision). Legacy callers (use_legacy_flow=true OR no
          # project-config.yml present) get the empty default and we fall
          # back to the rebase behavior to preserve historical semantics.
          : "${ON_CONFLICT:=rebase}"

          PUSHED_LIST=""
          PUSH_FAILED=""
          CONFLICT_SUBS=""
          for sub in $CHANGED_SUBS; do
            cd "$WORKSPACE_ROOT/${sub}"
            git config user.name  "innoways-claude-bot[bot]"
            git config user.email "innoways-claude-bot@users.noreply.github.com"

            git add -A
            git commit -m "${COMMIT_PREFIX} #${ISSUE_NUMBER}: ${ISSUE_TITLE}" \
                       -m "Auto-generated by Claude. Source: ${REPO_FULL}#${ISSUE_NUMBER}. Run: ${RUN_URL}"

            if [ "$ON_CONFLICT" = "fail" ]; then
              # Plan §14 locked decision: refuse to rebase Claude's commit onto
              # unknown work. If origin/$TARGET_BRANCH advanced, abort this sub.
              if ! "$SCRIPTS_DIR/precheck-remote-base.sh" "$WORKSPACE_ROOT/${sub}" "$TARGET_BRANCH"; then
                CONFLICT_SUBS="${CONFLICT_SUBS}${sub} "
                echo "::warning::${sub}: remote moved during run; aborting per on_conflict=fail"
                continue
              fi
            else
              # Legacy rebase behavior (on_conflict=rebase or unset).
              git fetch origin "$TARGET_BRANCH"
              if ! git rebase "origin/$TARGET_BRANCH"; then
                git rebase --abort || true
                PUSH_FAILED="${PUSH_FAILED}${sub}(rebase-conflict) "
                echo "::error::${sub}: rebase onto origin/$TARGET_BRANCH had conflicts"
                continue
              fi
            fi

            if git push origin "HEAD:$TARGET_BRANCH" 2>/tmp/claude-job/push-${sub}.log; then
              SHA=$(git rev-parse --short HEAD)
              PUSHED_LIST="${PUSHED_LIST}${sub}|${SHA}"$'\n'
            else
              PUSH_FAILED="${PUSH_FAILED}${sub}(push-rejected) "
              echo "::error::git push to ${TARGET_BRANCH} failed for ${sub}"
              cat /tmp/claude-job/push-${sub}.log
            fi
          done

          printf '%s' "$PUSHED_LIST" > /tmp/claude-job/pushed-list.txt

          # If ALL failures are remote-advanced (fail-fast collisions), emit
          # the dedicated conflict comment and set claude:conflict so the
          # operator knows exactly what happened. Mixed failures fall through
          # to the generic push_failed comment.
          if [ -n "$CONFLICT_SUBS" ] && [ -z "$PUSH_FAILED" ] && [ -z "$PUSHED_LIST" ]; then
            "$POST" issue_conflict "$RUN_URL" "$TARGET_BRANCH" "${CONFLICT_SUBS% }" \
              > /tmp/claude-job/conflict.md
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO_FULL" --body-file /tmp/claude-job/conflict.md
            "$SCRIPTS_DIR/set-issue-label.sh" --label "${CONFLICT_LABEL:-conflict}"
            exit 1
          fi

          # Mixed-failure or pure-push-failure case: surface what failed +
          # which subs already pushed (those can't be rolled back).
          FAILED_ALL="${PUSH_FAILED}${CONFLICT_SUBS}"
          if [ -n "$FAILED_ALL" ]; then
            "$POST" issue_push_failed "$RUN_URL" "${FAILED_ALL% }" /tmp/claude-job/pushed-list.txt \
              "$TARGET_BRANCH" \
              > /tmp/claude-job/push-failed.md
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO_FULL" --body-file /tmp/claude-job/push-failed.md
            "$SCRIPTS_DIR/set-issue-label.sh" run-failed
            exit 1
          fi

          "$POST" issue_pushed_multi /tmp/claude-job/pushed-list.txt "$TARGET_BRANCH" \
            > /tmp/claude-job/issue-comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO_FULL" --body-file /tmp/claude-job/issue-comment.md
          "$SCRIPTS_DIR/set-issue-label.sh" --label "${SUCCESS_LABEL:-pushed}"

      # ──────────────────────────────────────────────────────────────────
      # merge_request path — membership style
      # ──────────────────────────────────────────────────────────────────
      - name: Branch + push + open MR — one per modified subproject
        if: |
          contains(fromJSON('["fix","feature"]'), steps.mode.outputs.mode) &&
          steps.paths.outputs.blocked != 'true' &&
          steps.decide_push.outputs.skip_push != 'true' &&
          env.TERMINAL_ACTION == 'merge_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED_SUBS: ${{ steps.paths.outputs.changed_subs }}
          REPO_FULL: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          POST="$SCRIPTS_DIR/post-result.sh"

          if [ "$MODE" = "feature" ]; then
            COMMIT_PREFIX="feat"
          else
            COMMIT_PREFIX="fix"
          fi

          # Resolve ticket_num once for the whole run (same value across all
          # subs — the branch may use {sub} to disambiguate).
          export TICKET_NUM=$(python3 "$SCRIPTS_DIR/resolve-ticket-number.py")

          # Shared MR description — write once, reuse for all MRs (Summary
          # table is identical across subprojects).
          "$POST" mr_body "$REPO_FULL" "$ISSUE_NUMBER" "$RUN_URL" \
            > /tmp/claude-job/mr-body.md

          # Phase 1: branch + commit + push per sub. Push failures here are
          # pre-MR so we can abort without leaving orphan MRs around.
          PUSHED_SUBS=""
          PUSH_FAILED=""
          declare -A SUB_BRANCH
          for sub in $CHANGED_SUBS; do
            cd "$WORKSPACE_ROOT/${sub}"
            git config user.name  "innoways-claude-bot[bot]"
            git config user.email "innoways-claude-bot@users.noreply.github.com"

            # Resolve branch name per-sub (template may use {sub}).
            BRANCH=$(SUB="$sub" COLLISION_CHECK_PATH="$WORKSPACE_ROOT/${sub}" \
              python3 "$SCRIPTS_DIR/resolve-branch-name.py")
            SUB_BRANCH[$sub]="$BRANCH"

            git checkout -b "$BRANCH"
            git add -A
            git commit -m "${COMMIT_PREFIX} #${ISSUE_NUMBER}: ${ISSUE_TITLE}" \
                       -m "Auto-generated by Claude. Source: ${REPO_FULL}#${ISSUE_NUMBER}. Run: ${RUN_URL}"

            if git push -u origin HEAD 2>/tmp/claude-job/push-${sub}.log; then
              PUSHED_SUBS="${PUSHED_SUBS}${sub} "
            else
              PUSH_FAILED="${PUSH_FAILED}${sub} "
              echo "::error::git push failed for ${sub}"
              cat /tmp/claude-job/push-${sub}.log
              break
            fi
          done

          if [ -n "$PUSH_FAILED" ]; then
            {
              printf 'Claude run failed: git push failed for **%s**.\n\n' "${PUSH_FAILED% }"
              if [ -n "$PUSHED_SUBS" ]; then
                printf 'Branches already pushed (no MR opened, safe to delete):\n'
                for s in $PUSHED_SUBS; do
                  printf -- '- `%s` on %s\n' "${SUB_BRANCH[$s]}" "$s"
                done
                printf '\n'
              fi
              printf 'No MR opened. [Run log](%s)\n' "$RUN_URL"
            } > /tmp/claude-job/push-failed.md
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO_FULL" --body-file /tmp/claude-job/push-failed.md
            "$SCRIPTS_DIR/set-issue-label.sh" run-failed
            exit 1
          fi

          # Phase 2: open one MR per pushed sub. We deliberately don't break
          # on the first glab failure — surface every successful MR plus a
          # clear note of which subs failed.
          MR_LIST=""
          MR_FAILED=""
          # MR title template comes from project-config (default applied by
          # load-project-config.py).
          for sub in $PUSHED_SUBS; do
            cd "$WORKSPACE_ROOT/${sub}"
            BRANCH="${SUB_BRANCH[$sub]}"
            # Render MR title via the standalone helper (keeps the workflow
            # YAML parseable — embedded multi-line Python broke it).
            MR_TITLE=$(TEMPLATE="${MR_TITLE_TEMPLATE:-Fix #{ticket_num}: {title}}" \
              python3 "$SCRIPTS_DIR/render-template.py")

            GLAB_ARGS=(
              "mr" "create"
              "--target-branch" "$TARGET_BRANCH"
              "--source-branch" "$BRANCH"
              "--title" "$MR_TITLE"
              "--description" "$(cat /tmp/claude-job/mr-body.md)"
              "--yes"
            )
            if [ "${MR_REMOVE_SOURCE_BRANCH:-true}" = "true" ]; then
              GLAB_ARGS+=("--remove-source-branch")
            fi
            if [ "${MR_SQUASH:-false}" = "true" ]; then
              GLAB_ARGS+=("--squash")
            fi
            # Assignees / reviewers are space-separated lists; expand only if non-empty.
            if [ -n "${MR_ASSIGNEES:-}" ]; then
              for u in $MR_ASSIGNEES; do GLAB_ARGS+=("--assignee" "$u"); done
            fi
            if [ -n "${MR_REVIEWERS:-}" ]; then
              for u in $MR_REVIEWERS; do GLAB_ARGS+=("--reviewer" "$u"); done
            fi

            glab "${GLAB_ARGS[@]}" > /tmp/claude-job/glab-${sub}.log 2>&1 || true
            MR_URL=$(grep -Eo 'https://[^ ]+/-/merge_requests/[0-9]+' /tmp/claude-job/glab-${sub}.log | head -1)
            if [ -z "$MR_URL" ]; then
              echo "::warning::glab mr create did not return a URL for ${sub}"
              cat /tmp/claude-job/glab-${sub}.log
              MR_FAILED="${MR_FAILED}${sub} "
            else
              MR_LIST="${MR_LIST}${sub}|${MR_URL}"$'\n'
            fi
          done

          printf '%s' "$MR_LIST" > /tmp/claude-job/mr-list.txt

          # Cross-reference when 2+ MRs opened (must be merged together).
          MR_COUNT=$(printf '%s' "$MR_LIST" | grep -c '|' || true)
          if [ "$MR_COUNT" -ge 2 ]; then
            cp /tmp/claude-job/mr-body.md /tmp/claude-job/mr-body-augmented.md
            {
              echo ''
              echo '---'
              echo ''
              echo '**Related MRs from this run — must be merged together:**'
              echo ''
              while IFS='|' read -r sub url; do
                [ -z "$sub" ] && continue
                printf -- '- `%s` → %s\n' "$sub" "$url"
              done < /tmp/claude-job/mr-list.txt
            } >> /tmp/claude-job/mr-body-augmented.md
            while IFS='|' read -r sub url; do
              [ -z "$sub" ] && continue
              MR_NUM=$(echo "$url" | grep -oE '[0-9]+$')
              cd "$WORKSPACE_ROOT/${sub}"
              glab mr update "$MR_NUM" \
                --description "$(cat /tmp/claude-job/mr-body-augmented.md)" \
                > /tmp/claude-job/glab-update-${sub}.log 2>&1 \
                || echo "::warning::Failed to add cross-refs to ${sub} MR ${MR_NUM}"
            done < /tmp/claude-job/mr-list.txt
          fi

          if [ -n "$MR_LIST" ]; then
            "$POST" issue_mr_multi /tmp/claude-job/mr-list.txt "$TARGET_BRANCH" \
              > /tmp/claude-job/issue-comment.md
          else
            echo '**Claude pushed branches but no MR could be opened on GitLab.**' \
              > /tmp/claude-job/issue-comment.md
            echo '' >> /tmp/claude-job/issue-comment.md
          fi
          if [ -n "$MR_FAILED" ]; then
            {
              echo ''
              echo '> :warning: glab mr create failed for: **'"${MR_FAILED% }"'**'
              echo '>'
              echo '> Branches were pushed; admin should open the MR manually or rerun.'
            } >> /tmp/claude-job/issue-comment.md
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO_FULL" --body-file /tmp/claude-job/issue-comment.md

          if [ -n "$MR_FAILED" ]; then
            "$SCRIPTS_DIR/set-issue-label.sh" run-failed
            exit 1
          fi
          "$SCRIPTS_DIR/set-issue-label.sh" --label "${SUCCESS_LABEL:-mr-opened}"

      # ──────────────────────────────────────────────────────────────────
      # Telemetry (always)
      # ──────────────────────────────────────────────────────────────────

      - name: Record run metrics
        if: always()
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          SENDER: ${{ github.event.sender.login }}
          MODE: ${{ steps.mode.outputs.mode }}
          TARGET: ${{ steps.target.outputs.target }}
          CHANGED_SUBS: ${{ steps.paths.outputs.changed_subs }}
          BLOCKED: ${{ steps.paths.outputs.blocked }}
          WIKI_DIRTY: ${{ steps.wiki_dirty.outputs.dirty }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Append one JSON line per run to /home/user6/claude-runner-logs/metrics.jsonl
          # for offline analysis. Best-effort — never fails the job.
          mkdir -p /home/user6/claude-runner-logs || true
          METRICS=/home/user6/claude-runner-logs/metrics.jsonl
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          OUTPUT_BYTES=0
          if [ -f /tmp/claude-job/output.log ]; then
            OUTPUT_BYTES=$(wc -c < /tmp/claude-job/output.log 2>/dev/null || echo 0)
          fi
          jq -nc \
            --arg ts "$NOW" \
            --arg project "${PROJECT_NAME:-}" \
            --arg issue "${ISSUE_NUMBER:-0}" \
            --arg event "${EVENT_NAME:-}" \
            --arg sender "${SENDER:-}" \
            --arg mode "${MODE:-}" \
            --arg target "${TARGET:-}" \
            --arg changed_subs "${CHANGED_SUBS:-}" \
            --arg blocked "${BLOCKED:-false}" \
            --arg wiki_dirty "${WIKI_DIRTY:-0}" \
            --arg job_status "${JOB_STATUS:-}" \
            --arg output_bytes "${OUTPUT_BYTES:-0}" \
            --arg run_url "${RUN_URL:-}" \
            '{
              ts: $ts,
              project: $project,
              issue: ($issue | tonumber? // 0),
              event: $event,
              sender: $sender,
              mode: $mode,
              target: $target,
              changed_subs: $changed_subs,
              blocked: ($blocked == "true"),
              wiki_dirty: ($wiki_dirty == "1"),
              job_status: $job_status,
              output_bytes: ($output_bytes | tonumber? // 0),
              run_url: $run_url
            }' >> "$METRICS" 2>/dev/null || true
          tail -1 "$METRICS" 2>/dev/null || true
          true
